AddonId: SteamGridDB_Playnite_Metadata
Packages:
  - Version: 1.0
    RequiredApiVersion: 6.0.0
    ReleaseDate: 2021-09-08
    PackageUrl: https://github.com/cooperate/SteamGridDBMetadata/releases/download/1.0/SteamGridDB_Playnite_Metadata_1_0.pext
    Changelog:
      - Playnite 9 support
      - Added localizations support
      - Added button in settings page to open SteamGridDB API Key page
  - Version: 1.1
    RequiredApiVersion: 6.0.0
    ReleaseDate: 2021-07-05
    PackageUrl: https://github.com/cooperate/SteamGridDBMetadata/releases/download/1.1/SteamGridDB_Playnite_Metadata_1_1.pext
    Changelog:
      - Added option to download covers with dimensions 460x215 & 920x430 and 512x512 & 1024x1024 at the same time
      - Fix invalid Style options being available to select for background images
      - Fix error when downloading metadata for Steam games that are mods
  - Version: 1.2
    RequiredApiVersion: 6.0.0
    ReleaseDate: 2024-10-02
    PackageUrl: https://github.com/cooperate/SteamGridDBMetadata/releases/download/1.2/SteamGridDB_Playnite_Metadata_1_2.pext
    Changelog:
      - 'Fixed: Error when obtaining metadata for Steam demos'
      - 'Changed: Demo suffix will now be removed during the initial game search to provide better results from SteamGridDB in cases where the Playnite game entry is a demo'
  - Version: 1.0.0
    RequiredApiVersion: 6.0.0
    ReleaseDate: 2026-10-18
    PackageUrl: https://github.com/gOOvER/Playnite-SteamGridDBMetadataNG/releases/download/1.0.0/SteamGridDB_Playnite_Metadata_1.0.0.pext
    Changelog:
      - 'Added: Multi-platform matching (Steam, Epic, Origin, Battle.net, Ubisoft)'
      - 'Added: Automatic fallback to game title search when platform search returns 0 results'
      - 'Added: Epilepsy and image type (static/animated) filters'
      - 'Added: Rate limit backoff retry handling (HTTP 429)'
      - 'Fixed: Hero background image 404 URL path resolution error'
      - 'Fixed: Crash on games not found in SteamGridDB'
      - 'Fixed: Unhandled RuntimeBinderException during manual image selection'
      - 'Fixed: Path-traversal and URL injection in search autocomplete'
      - 'Changed: Modernized project to SDK-style targeting .NET 4.6.2 and PlayniteSDK 6.18.0'