name: CI Build & Package

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build & Package (.pext)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore SGDBMetadata.sln

    - name: Build Project (Release)
      run: dotnet build SGDBMetadata.sln -c Release --no-restore -p:DebugType=none -p:DebugSymbols=false

    - name: Package Playnite Extension (.pext)
      id: package
      shell: pwsh
      run: |
        $outDir = "SGDBMetadata/bin/Release/net462"
        if (-not (Test-Path $outDir)) {
          Write-Error "Build output directory not found: $outDir"
          exit 1
        }

        # Read addon ID and version from extension.yaml
        $yamlContent = Get-Content (Join-Path $outDir "extension.yaml") -Raw
        $addonId = if ($yamlContent -match '(?m)^Id:\s*([^\r\n]+)') { $Matches[1].Trim() } else { "SteamGridDB_Playnite_Metadata" }
        $version = if ($yamlContent -match '(?m)^Version:\s*([^\r\n]+)') { $Matches[1].Trim() } else { "1.0.0" }
        $versionTag = $version -replace '\.', '_'

        $pextName = "${addonId}_${versionTag}.pext"
        $binDir = "SGDBMetadata/bin"
        if (-not (Test-Path $binDir)) { New-Item -ItemType Directory -Path $binDir -Force }
        $pextPath = Join-Path $binDir $pextName

        # If toolbox packed it already, use it; otherwise create standard archive as .pext
        if (-not (Test-Path $pextPath)) {
          Write-Host "Creating extension package: $pextName"
          Compress-Archive -Path "$outDir\*" -DestinationPath $pextPath -Force
        } else {
          Write-Host "Extension package already created by build target: $pextName"
        }

        echo "pext_name=$pextName" >> $env:GITHUB_OUTPUT
        echo "pext_path=$pextPath" >> $env:GITHUB_OUTPUT

    - name: Upload .pext Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.package.outputs.pext_name }}
        path: ${{ steps.package.outputs.pext_path }}
        if-no-files-found: error
